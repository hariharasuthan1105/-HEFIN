name: Frontend quality gates
on:
  pull_request:
    branches: [hefin-3.0-development]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run typecheck && npm run build && npm test
        working-directory: frontend
      - name: Verify GitHub Pages base path without deployment
        working-directory: frontend
        run: |
          npx ng build --base-href /-HEFIN/ --output-path dist/pages
          cp dist/pages/browser/index.html dist/pages/browser/404.html
          node scripts/preview.mjs --pages &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4201/-HEFIN/ > /dev/null && break; sleep 1; done
          node tests/production-smoke.mjs --pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report
          retention-days: 7
