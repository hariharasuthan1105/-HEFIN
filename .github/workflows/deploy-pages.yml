name: Deploy HEFIN 3.0 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate 3D assets and Git LFS integrity
        working-directory: frontend
        run: |
          node -e '
            const fs = require("fs");
            for (const rel of ["public/assets/models/smart-hospital.glb", "public/assets/models/anatomical-brain.glb"]) {
              if (!fs.existsSync(rel)) { console.error("Missing GLB file:", rel); process.exit(1); }
              const stat = fs.statSync(rel);
              if (stat.size < 500000) { console.error("Invalid GLB size:", rel, stat.size); process.exit(1); }
              const fd = fs.openSync(rel, "r");
              const buf = Buffer.alloc(4);
              fs.readSync(fd, buf, 0, 4, 0);
              fs.closeSync(fd);
              const magic = buf.toString("ascii");
              if (magic !== "glTF") { console.error("Invalid GLB magic header:", rel, magic); process.exit(1); }
              console.log("Verified GLB asset:", rel, stat.size, "bytes, magic:", magic);
            }
          '

      - name: Build Angular application for GitHub Pages
        working-directory: frontend
        run: |
          npx ng build --base-href /-HEFIN/
          cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
